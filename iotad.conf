# iotad.conf -- IoT/OT traffic simulation daemon
#
# Run ONLY on a lab segment you own and are authorized to test. Every frame
# carries a spoofed source MAC/IP for a device that does not physically exist.

[network]
# Physical interface to transmit on (see: ip -brief link).
interface = enp10s0
# The lab subnet the simulated devices live in.
subnet = 192.168.40.0/24
# Default gateway -- used as the L2 next hop for any outbound (WAN) check-ins.
gateway = 192.168.40.1
# Address pool the fake devices are assigned from. Keep it clear of real hosts
# and outside your DHCP scope so you don't collide with anything real.
ip_pool_start = 192.168.40.50
ip_pool_end   = 192.168.40.229

# ---------------------------------------------------------------------------
# MULTI-SITE (true WAN site-to-site OT traffic across two Cato Sockets)
# ---------------------------------------------------------------------------
# The single [network] block above defines one site on one interface. To
# simulate a second physical site -- a second NIC wired to a SECOND Cato Socket
# -- add one [site:NAME] section per site INSTEAD of relying on [network].
# When any [site:*] section is present, [network] is ignored.
#
# Devices from the roster are distributed round-robin across the sites, each
# site gets its own Tx socket + responder on its own interface, and a share of
# the OT polls (Modbus/S7/EtherNet-IP/OPC-UA/DNP3/etc.) are aimed at listeners
# in the OTHER site -- routed via the local Socket's gateway so the flow
# actually traverses the Cato WAN and shows up as inter-site traffic.
#
# ARP-confirmed devices pass the Socket's uRPF, so cross-site OT polls route.
# Keep each site's ip_pool clear of real hosts and outside its DHCP scope.
#
# [site:hq]
# interface     = enp10s0
# subnet        = 192.168.40.0/24
# gateway       = 192.168.40.1
# ip_pool_start = 192.168.40.50
# ip_pool_end   = 192.168.40.229
#
# [site:plant]
# interface     = enp8s0f0          # 2nd NIC -> 2nd Cato Socket
# subnet        = 192.168.50.0/24
# gateway       = 192.168.50.1
# ip_pool_start = 192.168.50.50
# ip_pool_end   = 192.168.50.229

[simulation]
# How many simulated devices to run (roster size). Must fit the IP pool above.
device_count = 150
# Deterministic seed: same seed -> identical roster (MACs/IPs/hostnames) across
# restarts, so your Cato inventory stays stable. Change it to reshuffle.
seed = 1337
# Restrict to specific device categories (comma-separated), or leave blank for
# the full mix. Categories: ip_camera, nvr, access_control, intercom, hvac,
# building_automation, plc, rtu, hmi, industrial_networking, networking, voip,
# printer, av, power, lighting, environmental, iot_gateway
categories =
# Fraction of cross-site-capable OT polls aimed at a listener in the OTHER site
# (0.0 = never leave the local site, 1.0 = always cross the WAN). Only has an
# effect when two or more [site:*] sections are defined. Default 0.6.
cross_site_ratio = 0.6

[timing]
# Seconds between each beacon type, per device (jittered +/-25%).
arp_interval       = 300
dhcp_interval      = 1800
mdns_interval      = 120
ssdp_interval      = 180
lldp_interval      = 30
cdp_interval       = 60
discovery_interval = 120
poll_interval      = 90
# Outbound vendor check-ins fire at a random point in this window.
checkin_min = 180
checkin_max = 900

[outbound]
# Outbound (non-broadcast) flows: DNS lookups of vendor cloud hostnames, NTP,
# and TLS check-ins. These leave the local segment.
enabled = true
# subnet = only intra-LAN + broadcast flows; wan = also send to the internet;
# both = everything. WAN frames use spoofed source IPs and may be dropped by
# BCP38/uRPF filtering upstream -- that is expected and harmless for discovery.
scope = both
# Resolver the fake devices query (your LAN resolver is the realistic choice).
dns_server = 192.168.40.1
ntp_server = pool.ntp.org

[runtime]
pidfile = /run/iotad.pid
# Leave blank to log to stdout only (journald captures it under systemd).
logfile =
dry_run = false
# Hard cap on frames/second across all devices, so a burst can't flood the LAN.
max_pps = 50
