name: iotad-endpoint

services:
  endpoint:
    build: .
    container_name: iotad-rpf-endpoint
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      ENDPOINT_IP: 192.168.7.20
      MAX_ARTIFACT_BYTES: 1048576
    networks:
      plant_lan:
        ipv4_address: 192.168.7.20
        mac_address: "02:49:4f:54:41:20"

networks:
  plant_lan:
    name: iotad-rpf-plant
    driver: macvlan
    driver_opts:
      parent: enp8s0f0
    ipam:
      config:
        - subnet: 192.168.7.0/24
          gateway: 192.168.7.1
