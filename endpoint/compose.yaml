name: iotad-endpoint

services:
  endpoint:
    build: .
    image: iotad-rpf-endpoint:latest
    container_name: iotad-rpf-endpoint
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    environment:
      ENDPOINT_IP: 192.168.7.20
      MAX_ARTIFACT_BYTES: 1048576
    networks:
      plant_lan:
        ipv4_address: 192.168.7.20
        mac_address: "02:49:4f:54:41:20"

  campaign:
    image: iotad-rpf-endpoint:latest
    container_name: iotad-rpf-campaign
    restart: unless-stopped
    network_mode: host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      disable: true
    entrypoint: ["python", "/app/probe.py"]
    command: ["--watch", "--interval", "900", "149.20.200.136"]
    depends_on:
      endpoint:
        condition: service_healthy

networks:
  plant_lan:
    name: iotad-rpf-plant
    driver: macvlan
    driver_opts:
      parent: enp8s0f0
    ipam:
      config:
        - subnet: 192.168.7.0/24
          gateway: 192.168.7.1
